name: Automate-Build

on:
  push:
    branches: [ "main" ]

jobs:
  build-test-package:
      runs-on: ubuntu-latest

      steps:
        - name: Checkout-Java-Test
          uses: actions/checkout@v4
        
        - name: Compile
          run: javac calculator.java calculatortext.java
          
        - name: Test&Run
          run: |
                java -ea calculatortext.java
                java calculator.java
        - name: Create-Jar file
          run: jar cfe calculator-app.jar calculator calculator.class

        - name: Upload-JAR&Artifacts
          uses: actions/upload-artifact@v4
          with:
            name: calculator-build
            path: calculator-app.jar
          
        
